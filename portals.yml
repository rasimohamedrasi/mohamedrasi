# Career-Ops Portal Configuration for Mohamed Rasi
# Targeting IT Support, Hardware Technician, and Junior Cybersecurity roles in Ireland

title_filter:
  positive:
    - IT Support
    - Helpdesk
    - Service Desk
    - Help Desk
    - Desktop Support
    - Hardware Technician
    - Field Technician
    - Cybersecurity
    - Cyber Security
    - SOC Analyst
    - Security Analyst
    - Network Support
    - Systems Administrator
    - Cloud Support
    - Endpoint Security
    - Junior
    - Graduate
  negative:
    - Senior
    - Principal
    - Lead
    - Manager
    - Director
    - VP
    - Head of
    - Architect
  location_filter:
    allow:
      - Ireland
      - Dublin
      - Cork
      - Galway
      - Limerick
      - Waterford
      - Remote
      - Hybrid
    always_allow:
      - Ireland
    block:
      - United States
      - Canada
      - Australia
      - Singapore

search_queries:
  - query: "site:jobs.ie IT Support Junior Ireland"
  - query: "site:irishjobs.ie cybersecurity analyst graduate"
  - query: "site:linkedin.com/jobs IT support Dublin 2024"
  - query: "site:indeed.ie helpdesk technician ireland"
  - query: "site:greenhouse.io junior cybersecurity ireland"
  - query: "site:lever.co IT support engineer ireland"

